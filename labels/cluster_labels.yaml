# Cluster labels for divergence triage. Human-editable and version-controlled.
# These are proposals; review and edit before using them in the regression gate.
# label: desirable | undesirable | mixed
# rationale: required free text. ported_rule_hint: optional free text.
# Cluster ids refer to the persisted cluster model in artifacts/cluster_model.joblib;
# re-fitting the model invalidates them.
version: 1
clusters:
  '0':
    label: mixed
    rationale: The rule planner deviates up to 62.8 m from the human path (ADE 30.1
      m vs ML 10.8 m) on broken stitched centerlines; ML tracks the human far better
      but has 18 more collision flags (56 -> 74).
    ported_rule_hint: 'rule: improve centerline stitching quality; this cluster is
      map-limited, not policy-limited'
  '1':
    label: mixed
    rationale: 'ML proceeds where the rule asserts: +13.4 m progress, ADE 9.4 -> 6.6
      m, and slightly higher mean min TTC (1.64 -> 1.70 s), but collision flags rise
      173 -> 214.'
    ported_rule_hint: null
  '2':
    label: desirable
    rationale: 'ML brakes earlier and waits behind lead vehicles: mean min TTC 1.56
      -> 2.57 s over 1,184 scenarios, ADE vs the human 10.7 -> 6.8 m, at a cost of
      8.9 m progress. Caveat: ML collision flags are slightly higher (291 -> 325),
      so the ported override must lower the undesirable rate without inheriting that.'
    ported_rule_hint: 'rule: port ML-style early stop-and-wait behind braking or slow
      forward vehicles'
  '3':
    label: undesirable
    rationale: 'ML charges through where the rule holds back: +23.9 m progress and
      much smoother control (max jerk 25.0 -> 3.8 m/s^3), but mean min TTC drops 0.93
      -> 0.68 s and collision flags rise 608 -> 676; the progress is bought with safety
      margin.'
    ported_rule_hint: 'rule: keep current yield/IDM gating; gate any ML-style progress
      behind a min-TTC check'
  '4':
    label: desirable
    rationale: In one left-turn scenario the ML refuses to proceed (0.0 m progress,
      min TTC 1255 s) where the rule drives 7.2 m; conservative refusal beats unsafe
      progress.
    ported_rule_hint: 'rule: port ML''s refusal-to-enter behavior at this turn'
