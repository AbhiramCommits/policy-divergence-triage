[build-system]
requires = ["scikit-build-core>=0.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pdt"
version = "0.2.0"
description = "Replay logged driving scenarios through rule-based and learned policies; mine, cluster, and triage divergences."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pdt-shadow = "pdt.harness:main"
pdt-query = "pdt.query:main"
pdt-cluster = "pdt.cluster:main"
pdt-review = "pdt.review:main"
pdt-ab = "pdt.ab:main"
pdt-gate = "pdt.gate:main"

[project.optional-dependencies]
pipeline = [
  "av2",
  "numpy",
  "pandas",
  "pyarrow",
  "duckdb",
  "scikit-learn",
  "torch",
]
dev = ["pytest"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.args = ["-DPDT_BUILD_TESTS=OFF"]
wheel.packages = ["python/pdt"]
sdist.include = ["cpp/**", "tests/**", "scenarios/*.py", "scenarios/manifest.txt", "CMakeLists.txt", "NOTICE"]

[tool.pytest.ini_options]
markers = ["slow: long-running tests (fixture pipeline)"]

[tool.ruff]
line-length = 120
target-version = "py311"
ignore = ["RUF046"]  # misfires on numpy integer types, which still need int() for JSON

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = false
